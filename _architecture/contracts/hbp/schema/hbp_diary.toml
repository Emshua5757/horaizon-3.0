# =============================================================================
# HBP v2 — shua.diary Module Schema (TypeScript/Node)
# Diary Block Editor, Certification Roadmap, Sentiment, Global Memory Elevator
# Updated: TASK-017 + TASK-017B rebuild (native, no SDUI)
# =============================================================================

# ---------------------------------------------------------------------------
# Shared event structs
# ---------------------------------------------------------------------------

[[structs]]
name        = "SentimentEvent"
description = "Server-pushed sentiment analysis event"
[[structs.fields]]
index = 1
name  = "entry_id"
type  = "str"
[[structs.fields]]
index = 2
name  = "score"
type  = "f32"
[[structs.fields]]
index = 3
name  = "label"
type  = "str"

[[structs]]
name        = "EntryUpdatedEvent"
description = "Server-pushed real-time entry update event for multi-device optimistic concurrency"
[[structs.fields]]
index = 1
name  = "entry_id"
type  = "str"
[[structs.fields]]
index = 2
name  = "block_id"
type  = "str"
[[structs.fields]]
index = 3
name  = "version"
type  = "u32"

# ---------------------------------------------------------------------------
# Diary Entry Operations
# ---------------------------------------------------------------------------

[[operations]]
module          = "shua.diary"
name            = "entry.list"
type            = "rpc"
requires_auth   = true
description     = "Paginated diary entry list ordered by lexo_rank"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "entry.get"
type            = "rpc"
requires_auth   = true
description     = "Single entry with all blocks ordered by lexo_rank"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "entry.create"
type            = "rpc"
requires_auth   = true
description     = "Create a new diary entry"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "entry.save"
type            = "rpc"
requires_auth   = true
description     = "Upsert diary entry metadata (title, mood, logged_at, privacy)"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "entry.delete"
type            = "rpc"
requires_auth   = true
description     = "Delete a diary entry and all its blocks (CASCADE)"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "search"
type            = "rpc"
requires_auth   = true
description     = "Full-text search (FTS5) across diary entry titles and block contents"
request_struct  = ""
response_struct = ""

# ---------------------------------------------------------------------------
# Diary Block Operations
# ---------------------------------------------------------------------------

[[operations]]
module          = "shua.diary"
name            = "block.save"
type            = "rpc"
requires_auth   = true
description     = "Upsert a block with optimistic version locking — returns conflict error if version mismatch"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "block.reorder"
type            = "rpc"
requires_auth   = true
description     = "Reorder a block using LexoRank neighbor IDs"
request_struct  = ""
response_struct = ""

[[operations]]
module          = "shua.diary"
name            = "block.delete"
type            = "rpc"
requires_auth   = true
description     = "Delete a diary block"
request_struct  = ""
response_struct = ""

# ---------------------------------------------------------------------------
# Diary Events (Server-Pushed)
# ---------------------------------------------------------------------------

[[operations]]
module          = "shua.diary"
name            = "entry.updated"
type            = "event"
requires_auth   = true
description     = "Server-pushed real-time entry update notification for multi-device sync"
event_struct    = "EntryUpdatedEvent"

[[operations]]
module          = "shua.diary"
name            = "sentiment.score"
type            = "event"
requires_auth   = true
description     = "Server-pushed sentiment score after a block save (AI pipeline, TASK-018)"
event_struct    = "SentimentEvent"

# ---------------------------------------------------------------------------
# Memory Elevation
# ---------------------------------------------------------------------------

[[operations]]
module          = "shua.diary"
name            = "memory.elevate"
type            = "rpc"
requires_auth   = true
description     = "Elevate a diary entry to the Global Identity Matrix"
request_struct  = ""
response_struct = ""

